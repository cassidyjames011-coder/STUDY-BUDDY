name: Studioza security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Enable pinned package manager
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and run security regression tests
        run: pnpm check
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Verify committed build matches source
        run: git diff --exit-code -- public release.js
